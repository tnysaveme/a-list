<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161719" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <title>Your offline library — A-List</title>
    <link rel="stylesheet" href="/offline.css" />
    <script type="module" src="/offline-reader.js"></script>
  </head>
  <body>
    <main>
      <header><a href="/">A-List</a><button id="forget" hidden>Remove offline copy</button></header>
      <h1>Your Offline Library</h1>
      <p id="status" role="status">Opening the last synced library…</p>
      <p id="notice">
        Read-only copy · US release dates may have changed. Connect to update dates or change your
        library.
      </p>
      <a class="button" href="/">Try reconnecting</a>
      <label id="search-label" hidden
        >Find a saved film
        <input id="search" type="search" autocomplete="off" placeholder="Film title"
      /></label>
      <div id="films"></div>
      <noscript><p>JavaScript is needed to open your offline library.</p></noscript>
    </main>
  </body>
</html>
