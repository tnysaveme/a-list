name: WTS source drift
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wts-source-drift
  cancel-in-progress: true
jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check anchored and rotating public sources
        run: npm run wts:drift
        env:
          WTS_DRIFT_OUTPUT: outputs/wts-drift/checks.jsonl
      - name: Preserve source-check evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wts-source-checks-${{ github.run_id }}
          path: outputs/wts-drift/checks.jsonl
          if-no-files-found: warn
          retention-days: 30
